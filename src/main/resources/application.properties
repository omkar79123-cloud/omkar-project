server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_canteen?useSSL=${DB_REQUIRE_SSL:false}&requireSSL=${DB_REQUIRE_SSL:false}&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:smart_canteen}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.seed.student-password=${DEMO_STUDENT_PASSWORD:}
app.seed.faculty-password=${DEMO_FACULTY_PASSWORD:}
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:}
server.forward-headers-strategy=framework
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:tomcat}
