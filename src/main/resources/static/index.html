<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Canteen</title>
<style>body{font:16px system-ui;margin:2rem auto;max-width:760px;padding:0 1rem;color:#17202a}header{display:flex;justify-content:space-between;align-items:center}section{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}.item{display:flex;gap:1rem;align-items:center;border-bottom:1px solid #eee;padding:.6rem}.item span{flex:1}.money{font-variant-numeric:tabular-nums}button{padding:.55rem 1rem;cursor:pointer}.summary{display:grid;grid-template-columns:1fr auto;gap:.4rem}.error{color:#a00}.success{color:#075e2a}</style></head>
<body><header><h1>Smart Canteen</h1><strong id="wallet">Sign in to view wallet</strong></header>
<section><h2>Sign in or register</h2><label>Username <input id="username" autocomplete="username"></label> <label>Password <input id="password" type="password" autocomplete="current-password"></label> <label id="display-name-label">Name <input id="display-name" autocomplete="name"></label> <button id="login">Sign in</button> <button id="register">Create student account</button><p id="auth-message"></p></section>
<section><div id="menu"></div></section>
<section><label>Coupon <input id="coupon" placeholder="SAVE50"></label><p>Payment <label><input type="radio" name="pay" value="CASH" checked> Cash</label> <label><input type="radio" name="pay" value="WALLET"> Wallet</label></p><div class="summary"><span>Subtotal</span><b id="subtotal">₹0.00</b><span>Discount</span><b id="discount">₹0.00</b><span>Total</span><b id="total">₹0.00</b></div><button id="checkout">Place order</button><p id="message"></p></section>
<section><h2>Order history</h2><div id="history">Sign in to view history.</div><h2>Wallet transactions</h2><div id="transactions">Sign in to view transactions.</div></section>
<script>
let products=[];
const money=c=>"₹"+(c/100).toFixed(2), menu=document.querySelector("#menu");
let authorization="";
const api=(url,options={})=>fetch(url,{...options,headers:{...(options.headers||{}),...(authorization?{Authorization:authorization}:{})}});
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){products.forEach((p,i)=>menu.insertAdjacentHTML("beforeend",`<div class=item><span>${escapeHtml(p.name)} <small>${money(Math.round(p.price*100))}</small></span><input aria-label="${escapeHtml(p.name)} quantity" type=number min=0 value=0 data-i=${i}></div>`));document.querySelectorAll("[data-i]").forEach(x=>x.addEventListener("input",calculate));}
function calculate(){let subtotal=0;document.querySelectorAll("[data-i]").forEach(x=>subtotal+=Math.round(products[x.dataset.i].price*100)*+x.value);let rate=subtotal<60000?0:subtotal<120000?5:subtotal<=160000?10:15;let tier=Math.round(subtotal*rate/100);let coupon=document.querySelector("#coupon").value.trim().toUpperCase()==="SAVE50"&&subtotal>=50000?5000:0;let total=Math.max(0,subtotal-tier-coupon);document.querySelector("#subtotal").textContent=money(subtotal);document.querySelector("#discount").textContent=money(tier+coupon);document.querySelector("#total").textContent=money(total);return {subtotal,total};}
document.querySelector("#coupon").addEventListener("input",calculate);
async function loadAccount(){let r=await api("/api/accounts/me");if(!r.ok)throw new Error("Could not sign in");let a=await r.json();document.querySelector("#wallet").textContent=`${a.displayName} (${a.role}) · Wallet ${money(Math.round(a.walletBalance*100))}`;let [ordersResponse,txResponse]=await Promise.all([api("/api/orders"),api("/api/wallet/transactions")]);let orders=ordersResponse.ok?await ordersResponse.json():[],tx=txResponse.ok?await txResponse.json():[];document.querySelector("#history").innerHTML=orders.length?orders.map(o=>`<div>Order #${o.orderId} · ${money(Math.round(o.total*100))} · ${o.paymentMethod}</div>`).join(""):"No orders yet.";document.querySelector("#transactions").innerHTML=tx.length?tx.map(t=>`<div>${t.type} · ${money(Math.round(t.amount*100))} · balance ${money(Math.round(t.balanceAfter*100))}</div>`).join(""):"No wallet transactions yet.";}
async function authenticate(register){let username=document.querySelector("#username").value.trim(),password=document.querySelector("#password").value;let message=document.querySelector("#auth-message");if(!username||!password){message.className="error";message.textContent="Enter a username and password.";return;}if(register){let r=await api("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,displayName:document.querySelector("#display-name").value.trim(),password})});if(!r.ok){let d=await r.json();message.className="error";message.textContent=d.error||"Registration failed.";return;}}authorization="Basic "+btoa(unescape(encodeURIComponent(username+":"+password)));try{await loadAccount();message.className="success";message.textContent=register?"Account created and signed in.":"Signed in.";document.querySelector("#display-name-label").hidden=true;}catch(e){authorization="";message.className="error";message.textContent=register?"Account created. Sign in with the new credentials.":"Sign-in failed; check your credentials.";}}
document.querySelector("#login").onclick=()=>authenticate(false);
document.querySelector("#register").onclick=()=>authenticate(true);
document.querySelector("#checkout").onclick=async()=>{let items=[];document.querySelectorAll("[data-i]").forEach(x=>{if(+x.value)items.push({productId:products[x.dataset.i].id,quantity:+x.value})});if(!items.length)return;let r=await api("/api/orders/checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items,coupon:document.querySelector("#coupon").value,paymentMethod:document.querySelector("[name=pay]:checked").value})});let data=await r.json();let m=document.querySelector("#message");m.className=r.ok?"success":"error";m.textContent=r.ok?`Order #${data.orderId} placed. Total ${money(Math.round(data.total*100))}. Remaining wallet: ${money(Math.round(data.remainingWalletBalance*100))}`:(data.error||"Checkout failed");if(r.ok)loadAccount();};
api("/api/products").then(r=>r.ok?r.json():Promise.reject()).then(p=>{products=p;render();calculate()}).catch(()=>{menu.textContent="Unable to load menu.";});
</script></body></html>
