services:
  - type: web
    name: smart-canteen
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_REQUIRE_SSL
        value: "true"
      - key: DEMO_ADMIN_PASSWORD
        sync: false
